# 1. 将所有 HTTP 请求强制跳转到 HTTPS
server {
    listen 80;
    server_name fyuoblog.top www.fyuoblog.top;
    
    return 301 https://$host$request_uri;
}

# 2. HTTPS 核心配置
server {
    listen 443 ssl;
    server_name fyuoblog.top www.fyuoblog.top;

    # 证书路径（对应宿主机由 certbot 刚刚生成的路径）
    ssl_certificate /etc/letsencrypt/live/fyuoblog.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fyuoblog.top/privkey.pem;

    # 推荐的 SSL 安全配置
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # 1. 前端静态资源托管
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 完美支持 React Router History 模式
    }

    # 2. 后端 Gin 接口反向代理
    location /api/ {
        proxy_pass http://backend:8080; # 注意末尾有斜杠，会将 /api/ 剥离后再转发给 Gin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}