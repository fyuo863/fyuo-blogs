map $http_origin $admin_cross_origin {
    default 1;
    "" 0;
    "https://www.fyuoblog.top" 0;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
limit_req_status 429;
limit_conn_status 429;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

server {
    listen 80;
    server_name fyuoblog.top www.fyuoblog.top;
    client_max_body_size 1m;
    resolver 127.0.0.11 ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        set $backend_health http://backend:8080/api/v1/healthz;
        proxy_pass $backend_health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fyuoblog.top;
    client_max_body_size 1m;
    resolver 127.0.0.11 ipv6=off;

    ssl_certificate /etc/letsencrypt/live/fyuoblog.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fyuoblog.top/privkey.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; frame-src 'self'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known/acme-challenge/) { return 404; }
    location ~* \.(?:env|sql|bak|log)$ { return 404; }

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location = /healthz {
        set $backend_health http://backend:8080/api/v1/healthz;
        proxy_pass $backend_health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $resumer_upstream http://resumer-api:8765;
        proxy_pass $resumer_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/v1/showcase/ai-coding {
        client_max_body_size 512k;
        set $coding_upstream http://ai-coding-sync:18082;
        proxy_pass $coding_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/v1/admin/plugins {
        limit_conn connections 2;
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 33m;
        set $backend_upload http://backend:8080;
        proxy_pass $backend_upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/uploads/images {
        limit_conn connections 2;
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 9m;
        set $backend_upload http://backend:8080;
        proxy_pass $backend_upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/signin { return 403; }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_conn connections 32;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /plugin-assets/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        limit_req zone=mcp burst=20 nodelay;
        limit_conn connections 16;
        set $mcp_upstream http://mcp-blog-publisher:18081/mcp;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        limit_req zone=mcp burst=20 nodelay;
        limit_conn connections 16;
        set $mcp_upstream http://mcp-blog-publisher:18081/mcp/;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name www.fyuoblog.top;
    resolver 127.0.0.11 ipv6=off;
    ssl_certificate /etc/letsencrypt/live/fyuoblog.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fyuoblog.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    # A public plugin cannot use the management API across origins. No cookies
    # are used for login; all writes additionally require an explicit bearer.
    if ($admin_cross_origin) { return 403; }
    location ~ /\. { return 404; }
    location /plugin-assets/ { return 404; }
    location /uploads/ {
        location ~* \.(?:png|jpg|jpeg|gif|webp)$ {
            set $admin_images http://backend:8080;
            proxy_pass $admin_images;
            proxy_set_header Host $host;
        }
        return 404;
    }
    location = /api/v1/signin {
        client_max_body_size 4k;
        limit_req zone=login burst=5 nodelay;
        set $admin_login http://backend:8080;
        proxy_pass $admin_login;
        proxy_set_header Host $host;
    }
    location = /api/v1/admin/plugins {
        client_max_body_size 33m;
        limit_conn connections 2;
        limit_req zone=api burst=10 nodelay;
        set $admin_plugins http://backend:8080;
        proxy_pass $admin_plugins;
        proxy_set_header Host $host;
    }
    location = /api/v1/uploads/images {
        client_max_body_size 9m;
        limit_conn connections 2;
        limit_req zone=api burst=10 nodelay;
        set $admin_upload http://backend:8080;
        proxy_pass $admin_upload;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_conn connections 32;
        set $admin_api http://backend:8080;
        proxy_pass $admin_api;
        proxy_set_header Host $host;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
