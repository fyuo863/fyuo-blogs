name: Deploy Blog to Aliyun ECS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      action:
        description: "deploy builds a new image; rollback reuses an existing image tag"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      image_tag:
        description: "Image tag for manual deploy or rollback, for example v1.2.3"
        required: false
        default: ""

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release inputs
        run: |
          ACTION="deploy"
          TAG="${GITHUB_REF_NAME}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
            TAG="${{ inputs.image_tag }}"
            if [ -z "$TAG" ]; then
              TAG="latest"
            fi
          fi

          if [ "$ACTION" = "rollback" ] && [ "$TAG" = "latest" ]; then
            echo "::error::Rollback requires a concrete image_tag, for example v1.2.3"
            exit 1
          fi

          echo "DEPLOY_ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved action=$ACTION tag=$TAG"

      - name: Login to Aliyun ACR
        if: env.DEPLOY_ACTION == 'deploy'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        if: env.DEPLOY_ACTION == 'deploy'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-backend:latest
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-backend:${{ env.RELEASE_TAG }}

      - name: Build and push frontend image
        if: env.DEPLOY_ACTION == 'deploy'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-frontend:latest
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-frontend:${{ env.RELEASE_TAG }}

      - name: Build and push MCP image
        if: env.DEPLOY_ACTION == 'deploy'
        uses: docker/build-push-action@v5
        with:
          context: ./mcp/blog-publisher
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-mcp-publisher:latest
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-mcp-publisher:${{ env.RELEASE_TAG }}

      - name: Copy deployment files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "docker-compose.yml,nginx.conf"
          target: "/data/blog/"

      - name: Deploy or rollback on ECS
        uses: appleboy/ssh-action@master
        env:
          IMAGE_TAG: ${{ env.RELEASE_TAG }}
          DEPLOY_ACTION: ${{ env.DEPLOY_ACTION }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          envs: IMAGE_TAG,DEPLOY_ACTION,ALIYUN_REGISTRY,ALIYUN_REGISTRY_USER,ALIYUN_REGISTRY_PASSWORD
          script: |
            set -eu

            APP_DIR="/data/blog"

            preflight_fail() {
              echo "Deployment failed before changing running containers: $1"
              exit 1
            }

            runtime_fail() {
              echo "Deployment failed after starting containers: $1"
              docker compose ps || true
              docker compose logs --tail=120 nginx backend frontend mcp-blog-publisher || true
              docker compose stop nginx backend frontend mcp-blog-publisher || true
              exit 1
            }

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              preflight_fail "$APP_DIR/.env is missing"
            fi

            printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login --username="$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY" || preflight_fail "registry login failed"

            PREVIOUS_TAG="$(cat .release 2>/dev/null || true)"
            if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
              printf '%s\n' "$PREVIOUS_TAG" > .previous-release
            fi

            export IMAGE_TAG
            echo "Running $DEPLOY_ACTION with IMAGE_TAG=$IMAGE_TAG"

            docker compose pull backend frontend mcp-blog-publisher || preflight_fail "image pull failed"
            docker compose up -d --remove-orphans || runtime_fail "compose up failed"

            i=1
            while [ "$i" -le 36 ]; do
              if docker compose exec -T backend wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 &&
                 docker compose exec -T frontend test -f /share_dist/index.html &&
                 docker compose exec -T mcp-blog-publisher wget -qO- http://127.0.0.1:18081/healthz >/dev/null 2>&1 &&
                 docker compose exec -T nginx nginx -t >/dev/null 2>&1 &&
                 docker compose exec -T nginx wget -qO- http://backend:8080/healthz >/dev/null 2>&1 &&
                 docker compose exec -T nginx wget -qO- http://mcp-blog-publisher:18081/healthz >/dev/null 2>&1; then
                printf '%s\n' "$IMAGE_TAG" > .release
                docker image prune -f
                echo "Deployment healthy: $IMAGE_TAG"
                exit 0
              fi
              sleep 5
              i=$((i + 1))
            done

            runtime_fail "health check timed out for IMAGE_TAG=$IMAGE_TAG"

      - name: Send DingTalk notification
        if: success()
        uses: northwang-lucky/chatbot-webhook-client@v1.1.1
        with:
          app: DingTalk
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
          secret: ${{ secrets.DINGTALK_SECRET }}
          template: >-
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "Blog deployment succeeded",
                "text": "### Blog deployment succeeded\n\n**Action**: ${{ env.DEPLOY_ACTION }}\n\n**Image tag**: ${{ env.RELEASE_TAG }}\n\n**Actor**: ${{ github.actor }}\n\n[Open GitHub Actions](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }})"
              }
            }
