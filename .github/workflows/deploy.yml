name: Deploy Blog to Aliyun ECS

on:
  push:
    # 核心修改 1：只有在推送以 v 开头的 tag 时才触发自动部署 (例如 v1.0.0)
    tags:
      - "v*"
  # 保留手动触发按钮，方便你在没有发版时也想强制部署测试
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 核心修改 2：二次确认，确保只有 tag 推送或手动执行时才运行此任务
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升级到了更快的 v4 版本

      # 1. 登录阿里云容器镜像服务 (ACR)
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # 2. 构建并推送后端镜像 (借鉴你之前的项目，使用更优雅的官方 action)
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # 同时打上 latest 标签(给 docker-compose 用) 和 具体版本号标签(如 v1.0.0，方便历史回滚)
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-backend:latest
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-backend:${{ github.ref_name }}

      # 3. 构建并推送前端镜像
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-frontend:latest
            ${{ secrets.ALIYUN_REGISTRY }}/fyuo-blog/blog-frontend:${{ github.ref_name }}

      # 4. 【已修复】将 docker-compose 和 nginx 配置文件一同传到服务器
      - name: Copy Files via scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: "docker-compose.yml,nginx/nginx.conf" # 👈 确保 nginx.conf 也传过去
          target: "/data/blog/"

      # 5. SSH 登录服务器执行部署命令
      - name: SSH to ECS and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            mkdir -p /data/blog
            cd /data/blog

            # 登录服务器端的镜像仓库
            docker login --username=${{ secrets.ALIYUN_REGISTRY_USER }} --password=${{ secrets.ALIYUN_REGISTRY_PASSWORD }} ${{ secrets.ALIYUN_REGISTRY }}

            # 拉取刚打包好的 latest 新镜像
            docker compose pull

            # 重新启动服务并清理无用镜像
            docker compose up -d
            docker image prune -f
