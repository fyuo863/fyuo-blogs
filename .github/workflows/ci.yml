name: Full-Stack Code Quality Check (CI)

on:
  # 🎯 平时无论是推送到 main 分支，还是提 Pull Request，都会立刻触发检查
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch: # 允许手动点击触发

jobs:
  # 1. 后端 Go 代码质量检查
  backend-check:
    runs-on: ubuntu-latest
    services:
      plugin-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plugin_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: plugin_test
        ports:
          - 15449:5432
        options: >-
          --health-cmd "pg_isready -U plugin_test -d plugin_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"

      - name: Install dependencies
        run: |
          cd backend
          go mod download

      # 检查是否有基本的语法错误或编译问题
      - name: Test backend compilation
        run: |
          cd backend
          go build -v ./...

      - name: Run backend tests
        env:
          BLOG_PLUGIN_INTEGRATION: "1"
        run: cd backend && go test ./...

  # 2. 前端 React 代码质量检查
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci # 相比 npm install，ci 速度更快且更适合自动化环境

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      # 核心：检查代码是否能成功打包（能揪出绝大多数未定义的变量、类型错误等）
      - name: Test frontend compilation
        run: |
          cd frontend
          npm run build

      - name: Build optional plugin ZIPs (test only, never bundled with host)
        run: |
          cd frontend
          npm run build:plugins

      - name: Test view-event behavior
        run: cd frontend && npm test

      - name: Test independent usage sync service
        run: node --test services/ai-coding-sync/sync.test.mjs

      - name: Install browser for plugin compatibility checks
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Verify historical plugins and empty host compatibility
        run: cd frontend && npm run test:e2e

      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

  mcp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: mcp/blog-publisher
      - run: npm run build
        working-directory: mcp/blog-publisher
      - run: node --test security.test.mjs
        working-directory: mcp/blog-publisher
