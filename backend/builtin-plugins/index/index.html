<!doctype html><meta charset="utf-8"><title>index</title><style>body{font:16px system-ui;color:#17202a;max-width:900px;margin:4rem auto;padding:1rem}img{max-width:100%;border-radius:12px}.item{padding:1rem 0;border-bottom:1px solid #ddd}</style><main><h1 id="title">index</h1><div id="content">loading…</div></main><script>fetch('/api/v1/home-content').then(r=>r.json()).then(({data})=>{document.querySelector('#title').textContent=data.title||'index';const c=document.querySelector('#content');c.innerHTML=(data.items||[]).map(x=>`<article class="item"><h2>${x.name||x.title||''}</h2><p>${x.description||x.introduction||''}</p></article>`).join('')||'<p>暂无首页内容。</p>'}).catch(()=>document.querySelector('#content').textContent='首页内容暂不可用。');</script>
