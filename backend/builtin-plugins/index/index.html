<!doctype html><meta charset="utf-8"><title>index</title><link rel="stylesheet" href="style.css"><div id="dots" class="dots" aria-hidden="true"></div><main><h1 id="title">index</h1><div id="content">loading…</div></main><script>const dots=document.querySelector("#dots");for(let i=0;i<42;i++){const dot=document.createElement("i");dot.className="dot";dot.style.left=(Math.random()*100)+"%";dot.style.top=(Math.random()*100)+"%";dot.style.animationDelay=(-Math.random()*8)+"s";dot.style.animationDuration=(4+Math.random()*6)+"s";dots.appendChild(dot)}fetch('/api/v1/home-content').then(r=>r.json()).then(({data})=>{document.querySelector('#title').textContent=data.title||'index';const c=document.querySelector('#content');c.innerHTML=(data.items||[]).map(x=>`<article class="item"><h2>${x.name||x.title||''}</h2><p>${x.description||x.introduction||''}</p></article>`).join('')||'<p>暂无首页内容。</p>'}).catch(()=>document.querySelector('#content').textContent='首页内容暂不可用。');</script>
