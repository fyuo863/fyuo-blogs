<!doctype html><meta charset="utf-8"><title>journal</title><style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:1rem}.post{padding:1rem 0;border-bottom:1px solid #ddd;cursor:pointer}.meta{color:#687078;font-size:.85rem}.detail{white-space:pre-wrap;line-height:1.7}button{padding:.4rem .8rem}</style><main><h1>journal</h1><input id="q" placeholder="搜索文章"><button id="search">search</button><section id="list">loading…</section></main><script>const list=document.querySelector('#list'),visitorId='plugin-journal-'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function eventId(){return Date.now()+'-'+Math.random().toString(36).slice(2)}function render(items){list.innerHTML=items.map(p=>`<article class="post" data-id="${p.id}"><h2>${esc(p.title)}</h2><div class="meta">${esc(p.created_at)} · views ${p.view_count||0} · likes ${p.like_count||0}</div><p>${esc(String(p.content||'').slice(0,160))}</p></article>`).join('')||'<p>暂无文章。</p>';document.querySelectorAll('.post').forEach(x=>x.onclick=()=>openPost(x.dataset.id))}function load(url='/api/v1/articles'){fetch(url).then(r=>r.json()).then(x=>render(x.data||[])).catch(()=>list.textContent='文章服务暂不可用。')}function openPost(id){fetch('/api/v1/articles/'+id).then(r=>r.json()).then(x=>{const p=x.data;list.innerHTML=`<button onclick="load()">back</button><article class="detail"><h2>${esc(p.title)}</h2><p>${esc(p.content)}</p><button onclick="view(${p.id})">记录浏览</button></article>`;view(p.id)});}function view(id){fetch('/api/v1/articles/'+id+'/view',{method:'POST',headers:{'X-Event-Id':eventId(),'X-Visitor-Id':visitorId}})}document.querySelector('#search').onclick=()=>{const q=document.querySelector('#q').value.trim();load(q?'/api/v1/articles/search?q='+encodeURIComponent(q):'/api/v1/articles')};load();</script>
