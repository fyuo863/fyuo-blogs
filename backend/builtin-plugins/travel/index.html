<!doctype html><meta charset="utf-8"><title>travel</title><style>body{font:16px system-ui;max-width:1000px;margin:3rem auto;padding:1rem}.place{padding:1rem;border-bottom:1px solid #ddd}.coords{color:#687078}</style><main><h1>travel</h1><section id="list">loading…</section></main><script>fetch('/api/v1/travel-places').then(r=>r.json()).then(({data=[]})=>{document.querySelector('#list').innerHTML=data.map(p=>`<article class="place"><h2>${p.name||''}</h2><p>${p.description||''}</p><div class="coords">${p.latitude}, ${p.longitude}</div></article>`).join('')||'<p>暂无旅行地点。</p>'}).catch(()=>document.querySelector('#list').textContent='旅行数据暂不可用。');</script>
