<!doctype html><meta charset="utf-8"><title>travel</title><link rel="stylesheet" href="style.css"><main><h1>travel</h1><section id="list">loading…</section></main><script>fetch('/api/v1/travel-places').then(r=>r.json()).then(({data=[]})=>{document.querySelector('#list').innerHTML=data.map(p=>`<article class="place"><h2>${p.name||''}</h2><p>${p.description||''}</p><div class="coords">${p.latitude}, ${p.longitude}</div></article>`).join('')||'<p>暂无旅行地点。</p>'}).catch(()=>document.querySelector('#list').textContent='旅行数据暂不可用。');</script>
