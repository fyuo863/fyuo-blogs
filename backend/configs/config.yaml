Server:
  host: "0.0.0.0"
  port: 8080
  mode: "release" #gin 运行模式: debug | release | test

database:
  host: "postgres"
  port: 5432
  user: "root"
  password: ""                    # 从环境变量 DB_PASSWORD 读取
  dbname: "myblog"
  sslmode: "disable"
  timezone: "Asia/Shanghai"
  # --- 连接池配置 ---
  max_idle_conns: 10 # 最大空闲连接数
  max_open_conns: 100 # 最大打开连接数
  conn_max_lifetime: 3600 # 连接最大存活时间（单位：秒，建议用纯数字在代码里转时间）

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  pool_size: 100 # 连接池大小
  query_timeout: 2s # 单次 Redis 操作超时

auth:
  token_secret: "" # 推荐通过 AUTH_TOKEN_SECRET 注入；为空时回退到 DB_PASSWORD
  token_ttl_hours: 24
